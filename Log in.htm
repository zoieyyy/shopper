<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('sn-theme')||'red');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — ShopperNow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --brand: #A91E3F; --brand-dark: #8a1833; }
  [data-theme="purple"] { --brand: #7535DE; --brand-dark: #5e28b8; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    background: #f4f6f9;
    color: #1a1a1a;
    line-height: 1.5;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  .login-header {
    background: #2b2b2b;
    padding: 0 20px;
    height: 50px;
    display: flex; align-items: center;
  }
  .header-logo { font-size: 15px; font-weight: 600; color: #fff; text-decoration: none; letter-spacing: 0.02em; }
  .header-logo span { background: var(--brand); color: #fff; padding: 2px 7px; border-radius: 3px; margin-left: 4px; }

  .login-body {
    flex: 1;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 48px 16px 48px;
  }

  .login-wrap {
    width: 100%; max-width: 380px;
  }

  .login-card {
    background: #fff; border: 0.5px solid #dde1ea; border-radius: 8px;
    padding: 32px 28px;
    margin-bottom: 16px;
  }

  .login-title {
    font-size: 20px; font-weight: 700; margin-bottom: 24px;
  }

  .form-group { margin-bottom: 14px; }
  .form-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: #888;
    display: block; margin-bottom: 5px;
  }
  .form-control {
    width: 100%; padding: 9px 11px;
    border: 1px solid #ddd; border-radius: 3px;
    font-size: 13px; font-family: inherit;
    background: #fff; color: #1a1a1a;
  }
  .form-control:focus { outline: none; border-color: #999; }

  .checkbox-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 18px;
  }
  .checkbox-row input { width: 14px; height: 14px; cursor: pointer; }
  .checkbox-row label { font-size: 13px; color: #555; cursor: pointer; }

  .btn-signin {
    width: 100%; padding: 10px;
    background: var(--brand); color: #fff;
    border: none; border-radius: 3px;
    font-size: 13px; font-weight: 600; font-family: inherit;
    cursor: pointer; letter-spacing: 0.02em;
    margin-bottom: 16px;
  }
  .btn-signin:hover { background: var(--brand-dark); }

  .login-links {
    display: flex; flex-direction: column; gap: 8px;
    text-align: center; font-size: 13px; color: #666;
  }
  .login-links a { color: #1a1a1a; text-decoration: none; font-weight: 600; }
  .login-links a:hover { text-decoration: underline; }

  /* Contact card */
  .contact-card {
    background: #fff; border: 0.5px solid #dde1ea; border-radius: 8px;
    padding: 20px 28px;
  }
  .contact-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: #aaa;
    margin-bottom: 12px; padding-bottom: 10px;
    border-bottom: 1px solid #f0f0f0;
  }
  .contact-item { font-size: 13px; color: #555; margin-bottom: 4px; }
  .contact-item strong { color: #1a1a1a; }
  .contact-section { margin-bottom: 12px; }
  .contact-section:last-child { margin-bottom: 0; }

  .login-footer {
    text-align: center; padding: 12px;
    font-size: 11.5px; color: #888;
    background: #1a1a1a; position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
  }
  body { padding-bottom: 40px; }
</style>
</head>
<body>

<div class="login-header">
  <a class="header-logo" href="dashboard.HTML">SHOPPER<span>NOW</span></a>
</div>

<div class="login-body">
  <div class="login-wrap">

    <div class="login-card">
      <div class="login-title">Sign in</div>

      <form action="#" method="post">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="remember" name="remember" checked>
          <label for="remember">Remember me</label>
        </div>
        <button type="submit" class="btn-signin">Sign in</button>
        <div class="login-links">
          <span>Don't have an account? <a href="https://shoppernow.com.au/Account/LandingPage.aspx">Register</a></span>
          <span>Forgot password? <a href="https://shoppernow.com.au/Account/Forgot.aspx">Click here</a></span>
        </div>
      </form>
    </div>

    <div class="contact-card">
      <div class="contact-title">Contact Us</div>
      <div class="contact-section">
        <div class="contact-item"><strong>Phone:</strong> 02 7908 3097</div>
        <div class="contact-item"><strong>Email:</strong> contact@shoppernow.com.au</div>
      </div>
      <div class="contact-section">
        <div class="contact-item" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:#aaa; margin-bottom:4px;">Office Hours (AEST)</div>
        <div class="contact-item">Mon – Fri: 9am – 5pm</div>
        <div class="contact-item">Saturday: 9am – 2pm</div>
        <div class="contact-item">Sunday: 9am – 12pm</div>
      </div>
    </div>

  </div>
</div>

<div class="login-footer">Copyright &copy; Creative Activation 2026</div>


<script src="assets/theme-switcher.js"></script>
</body>
</html>
